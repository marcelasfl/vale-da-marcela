<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Portfólio — Marcela Starling</title>
<style>
  :root{
    --ink:#2b1d0e; --wood:#8a5a2b; --wood-d:#5e3a17; --paper:#fff4d6;
    --paper-d:#e8d29a; --green:#7bb641; --accent:#3aa0ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#1b2a1a;overflow:hidden;
    font-family:"Courier New",monospace;color:var(--ink);
    -webkit-user-select:none;user-select:none;touch-action:none;}
  #game{display:block;width:100vw;height:100vh;image-rendering:pixelated;background:#4a7a3a;}
  .hidden{display:none !important}

  /* ---------- creator overlay ---------- */
  #creator{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 120% at 50% 0%, #3a5f8a 0%, #223a5e 60%, #16233a 100%);
    padding:16px;z-index:20;}
  .panel{width:min(760px,96vw);max-height:96vh;overflow:auto;background:var(--paper);
    border:6px solid var(--wood-d);border-radius:14px;
    box-shadow:0 0 0 6px var(--wood) inset, 0 18px 40px rgba(0,0,0,.5);
    padding:20px 22px;text-align:center;}
  .panel h1{margin:.1em 0 .1em;font-size:26px;letter-spacing:1px;color:var(--wood-d);
    text-shadow:1px 1px 0 var(--paper-d);}
  .panel p.sub{margin:.2em 0 14px;font-size:14px;color:#6b4a22;}
  .langbar{display:flex;justify-content:flex-end;gap:6px;margin-bottom:2px}
  .langbtn{font-family:inherit;font-size:12px;font-weight:bold;cursor:pointer;padding:4px 9px;
    border-radius:6px;border:2px solid var(--wood);background:var(--paper-d);color:var(--wood-d)}
  .langbtn.sel{background:var(--green);color:#123;border-color:#4d7a1f}
  .stage{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
  #preview{image-rendering:pixelated;background:linear-gradient(#bfe08a,#8fc25a);
    border:4px solid var(--wood-d);border-radius:10px;width:200px;height:220px;flex:0 0 auto}
  .controls{flex:1 1 300px;min-width:280px;text-align:left}
  .row{display:flex;align-items:center;gap:8px;margin:9px 0}
  .row label{flex:0 0 96px;font-weight:bold;font-size:13px;color:var(--wood-d);text-transform:uppercase}
  .opt{flex:1 1 auto;display:flex;align-items:center;gap:8px;justify-content:space-between;
    background:var(--paper-d);border:2px solid var(--wood);border-radius:8px;padding:4px 6px}
  .opt .val{flex:1 1 auto;text-align:center;font-size:13px;font-weight:bold;color:var(--wood-d)}
  .swatches{display:flex;flex-wrap:wrap;gap:6px}
  .sw{width:26px;height:26px;border-radius:6px;border:3px solid rgba(0,0,0,.25);cursor:pointer}
  .sw.sel{border-color:#111;box-shadow:0 0 0 2px #fff inset}
  .namebox{width:100%;font-family:inherit;font-size:15px;padding:8px 10px;border:2px solid var(--wood);
    border-radius:8px;background:#fff;color:var(--ink)}
  button.pix{font-family:inherit;font-weight:bold;cursor:pointer;border:none;border-radius:8px}
  .arrow{width:30px;height:30px;font-size:16px;background:var(--wood);color:#fff;
    border:2px solid var(--wood-d);border-radius:6px}
  .arrow:active{transform:translateY(1px)}
  #start{margin-top:16px;background:var(--green);color:#123;padding:14px 26px;font-size:18px;
    letter-spacing:1px;box-shadow:0 5px 0 #4d7a1f;text-transform:uppercase}
  #start:active{transform:translateY(3px);box-shadow:0 2px 0 #4d7a1f}

  /* ---------- HUD ---------- */
  #hud{position:fixed;left:10px;top:10px;z-index:8;pointer-events:none;
    font-size:12px;color:#fff;text-shadow:1px 1px 0 #000;line-height:1.5}
  #hud b{color:#ffe27a}
  #progress{position:fixed;right:10px;top:10px;z-index:8;color:#fff;text-shadow:1px 1px 0 #000;
    font-size:12px;text-align:right}
  #hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:8;
    background:rgba(0,0,0,.55);color:#fff;padding:6px 12px;border-radius:8px;font-size:13px;
    border:2px solid rgba(255,255,255,.25);white-space:nowrap}

  /* ---------- touch controls ---------- */
  #touch{position:fixed;inset:auto 0 0 0;z-index:9;display:none;
    justify-content:space-between;align-items:flex-end;padding:16px;pointer-events:none}
  #dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px;pointer-events:auto}
  #dpad .b{background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.3);border-radius:10px;
    color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center}
  #dpad .b:active{background:rgba(0,0,0,.7)}
  #act{width:74px;height:74px;border-radius:50%;background:rgba(58,160,255,.75);
    border:3px solid #fff;color:#fff;font-weight:bold;font-size:16px;pointer-events:auto}
  @media (pointer:coarse){#touch{display:flex} #hint{bottom:112px}}

  /* ---------- dialogue ---------- */
  #dlg{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(680px,94vw);
    z-index:12;background:var(--paper);border:5px solid var(--wood-d);border-radius:14px;
    box-shadow:0 0 0 5px var(--wood) inset,0 12px 30px rgba(0,0,0,.5);padding:14px 16px;display:none}
  #dlg .head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  #dlg .ic{width:34px;height:34px;border-radius:8px;flex:0 0 auto;display:flex;align-items:center;
    justify-content:center;font-size:20px;background:var(--paper-d);border:2px solid var(--wood)}
  #dlg .title{font-weight:bold;font-size:16px;color:var(--wood-d);letter-spacing:1px;text-transform:uppercase}
  #dlg .body{font-size:15px;line-height:1.55;color:#3a2a12;min-height:66px;white-space:pre-wrap}
  #dlg .next{text-align:right;font-size:12px;color:#8a6a34;margin-top:6px}
  @media (max-width:480px){ .panel h1{font-size:21px} #dlg .body{font-size:14px} }

  /* ---------- guestbook ---------- */
  #book{position:fixed;inset:0;z-index:16;display:none;align-items:center;justify-content:center;
    background:rgba(16,20,30,.6);padding:16px}
  .bookpanel{width:min(420px,94vw);max-height:88vh;display:flex;flex-direction:column;background:var(--paper);
    border:6px solid var(--wood-d);border-radius:14px;box-shadow:0 0 0 6px var(--wood) inset,0 16px 40px rgba(0,0,0,.5);
    padding:16px 18px;text-align:center}
  .bookpanel h2{margin:.1em 0;font-size:20px;color:var(--wood-d)}
  .booksub{margin:.2em 0 10px;font-size:13px;color:#6b4a22}
  #bookList{flex:1 1 auto;overflow:auto;text-align:left;border:2px solid var(--paper-d);border-radius:8px;
    padding:8px 10px;background:#fffdf5;min-height:120px}
  .bookrow{font-size:14px;color:var(--ink);padding:4px 2px;border-bottom:1px dashed var(--paper-d)}
  .bookempty{color:#8a6a34;font-size:13px;text-align:center;padding:26px 8px}
  #bookClose{margin-top:14px;background:var(--wood);color:#fff;padding:10px 20px;font-size:15px}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden"></div>
<div id="progress" class="hidden"></div>
<div id="hint" class="hidden"></div>

<div id="touch">
  <div id="dpad">
    <span></span><div class="b" data-k="up">▲</div><span></span>
    <div class="b" data-k="left">◀</div><span></span><div class="b" data-k="right">▶</div>
    <span></span><div class="b" data-k="down">▼</div><span></span>
  </div>
  <button id="act" class="pix">LER</button>
</div>

<div id="dlg">
  <div class="head"><div class="ic" id="dlgIc">🌱</div><div class="title" id="dlgTitle"></div></div>
  <div class="body" id="dlgBody"></div>
  <div class="next" id="dlgNext">▼ espaço / clique para continuar</div>
</div>

<div id="book">

    <h2 id="bookTitle">📖 Livro de visitas</h2>
    <p class="booksub" id="bookIntro"></p>
    <div id="bookList"></div>
    <button id="bookClose" class="pix">Fechar</button>
  </div>
</div>

<div id="creator">

    <div class="langbar">

        <div class="row"><label id="lblCabelo">Cabelo</label>

    <button id="start" class="pix">▶ Começar aventura</button>

</div>

  cv.width = innerWidth; cv.height = innerHeight;

function shade(hex,d){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)+d, g=((n>>8)&255)+d, b=(n&255)+d;
  r=Math.max(0,Math.min(255,r)); g=Math.max(0,Math.min(255,g)); b=Math.max(0,Math.min(255,b));
  return "#"+(1<<24|r<<16|g<<8|b).toString(16).slice(1);
}

/* ---------------- character drawing ---------------- */
// draws a 16x32 farmer at (ox,oy) in virtual px. dir: 0 down,1 up,2 right,3 left. frame:0..3
function drawChar(g, ox, oy, dir, frame, pl, s){
  const p = pl;
  const R=(x,y,w,h,c)=>{ g.fillStyle=c; g.fillRect(Math.round(ox+x*s),Math.round(oy+y*s),Math.ceil(w*s),Math.ceil(h*s)); };
  const pose = [0,1,0,2][frame&3];
  const flip = dir===3;
  if(flip){ g.save(); g.translate(Math.round(ox+16*s),0); g.scale(-1,1); ox=0; }
  const D = flip?2:dir;   // draw right, mirror handles left

  // leg animation
  let lY=22,rY=22;
  if(pose===1){ lY=21; rY=23; } else if(pose===2){ lY=23; rY=21; }

  // shadow
  g.fillStyle="rgba(0,0,0,.20)"; g.beginPath();
  g.ellipse(Math.round(ox+8*s), Math.round(oy+30*s), 6*s, 2*s, 0,0,7); g.fill();

  if(D===0 || D===1){ // front / back
    // legs
    R(4,lY,3,6,p.pants); R(4,lY+6,3,2,p.shoes);
    R(9,rY,3,6,p.pants); R(9,rY+6,3,2,p.shoes);
    // torso
    R(4,15,8,7,p.shirt);
    // arms
    let alY=15,arY=15; if(pose===1){alY=16;arY=14;} else if(pose===2){alY=14;arY=16;}
    R(2,alY,2,6,p.shirt); R(2,alY+6,2,1,p.skin);
    R(12,arY,2,6,p.shirt); R(12,arY+6,2,1,p.skin);
    // head
    R(4,6,8,8,p.skin); R(3,9,1,2,p.skin); R(12,9,1,2,p.skin);
    if(D===0){ // face
      R(5,15,6,1,p.shirtD);
      R(6,10,1,2,p.eye); R(9,10,1,2,p.eye);
      R(7,12,2,1,p.skinD);
    }
    drawHair(R, dir, p);
  } else { // side (right)
    // back leg
    R(5,rY,3,6,p.pantsD); R(5,rY+6,3,2,shade(p.shoes,-15));
    // front leg
    R(8,lY,3,6,p.pants); R(8,lY+6,3,2,p.shoes);
    // torso
    R(5,15,6,7,p.shirt);
    // back arm
    let aY=15; if(pose===1)aY=16; else if(pose===2)aY=14;
    R(4,aY,2,6,p.shirtD); R(4,aY+6,2,1,p.skinD);
    // head
    R(5,6,7,8,p.skin);
    R(11,10,1,2,p.eye); R(12,11,1,1,p.skinD);
    // front arm
    let fY=15; if(pose===1)fY=14; else if(pose===2)fY=16;
    R(8,fY,2,6,p.shirt); R(8,fY+6,2,1,p.skin);
    drawHair(R, 2, p);
  }
  if(flip) g.restore();
}

function drawHair(R, dir, p){
  const st = pal.style;
  const H=p.hair, HD=p.hairD;
  if(dir===0||dir===1){ // front/back cap
    R(4,4,8,3,H); R(3,6,1,4,H); R(12,6,1,4,H);
    if(dir===1){ R(4,6,8,7,H); } else { R(4,6,8,1,H); }
    if(st===1){ R(4,3,1,1,H);R(6,2,1,2,H);R(8,3,1,1,H);R(10,2,1,2,H); }
    if(st===2){ R(3,6,1,10,H); R(12,6,1,10,H); if(dir===1)R(4,13,8,3,H); }
    if(st===3){ R(3,3,10,4,H); R(2,5,1,4,H); R(13,5,1,4,H); }
    if(st===4){ R(4,5,7,2,H); R(3,5,1,6,H); }
    if(st===5){ R(6,2,4,3,HD); R(4,4,8,3,H); }
    if(st===6){ R(6,3,4,2,H); if(dir===1){ R(6,7,4,9,H); R(6,15,4,1,HD); } else { R(12,7,2,6,H); R(3,6,1,2,H); } }
    if(st===7){ R(3,6,1,8,H); R(12,6,1,8,H); R(4,5,8,2,H); if(dir===1)R(4,6,8,8,H); }
    if(st===8){ R(7,1,2,5,H); R(6,2,4,2,H); R(6,4,4,2,HD); }
    if(st===9){ R(4,6,8,2,H); R(3,6,1,12,H); R(12,6,1,12,H); if(dir===1)R(4,6,8,13,H); }
    if(st===10){ R(3,6,1,11,H); R(12,6,1,11,H); R(3,10,1,1,HD); R(12,13,1,1,HD); if(dir===1){R(4,6,8,12,H);R(5,11,1,1,HD);R(9,14,1,1,HD);} }
  } else { // side (right facing)
    R(4,4,8,3,H); R(4,5,3,8,H); R(7,6,2,1,H);
    if(st===1){ R(4,3,1,1,H);R(6,2,1,2,H);R(8,3,1,1,H); }
    if(st===2){ R(4,5,3,12,H); }
    if(st===3){ R(3,3,8,4,H); R(3,6,2,5,H); }
    if(st===4){ R(4,5,8,2,H); }
    if(st===5){ R(5,2,4,3,HD); R(4,4,8,3,H); }
    if(st===6){ R(2,6,3,3,H); R(1,8,2,5,H); R(4,5,3,4,H); }
    if(st===7){ R(4,5,4,9,H); }
    if(st===8){ R(5,1,3,5,H); R(5,3,3,2,HD); }
    if(st===9){ R(4,5,3,12,H); R(10,6,2,2,H); }
    if(st===10){ R(4,5,3,11,H); R(4,10,1,1,HD); R(5,13,1,1,HD); }
  }
}

const map = [];
(function buildMap(){
  for(let y=0;y<MAP_H;y++){ const row=[]; for(let x=0;x<MAP_W;x++) row.push(0); map.push(row); }
  // main horizontal path
  for(let x=2;x<MAP_W-2;x++){ map[10][x]=1; map[11][x]=1; }
  // vertical branches up to the top-row signs
  [5,11,17,23].forEach(bx=>{ for(let y=4;y<=11;y++){ map[y][bx]=1; } });
  // lower branches to the bottom-row signs
  [11,23].forEach(bx=>{ for(let y=11;y<=18;y++){ map[y][bx]=1; } });
  // pond (bottom-right)
  for(let y=14;y<18;y++) for(let x=26;x<30;x++) map[y][x]=2;
  // flower bed
  for(let x=2;x<5;x++){ map[16][x]=3; map[17][x]=3; }
})();

/* ---------------- collision ---------------- */
function blocked(nx,ny){
  // world bounds
  if(nx<TS || ny<TS || nx+player.w>WORLD_W-TS || ny+player.h>WORLD_H-TS) return true;
  // water tiles
  const pts=[[nx,ny+player.h],[nx+player.w,ny+player.h],[nx,ny+player.h-2],[nx+player.w,ny+player.h-2]];
  for(const [px,py] of pts){
    const tx=Math.floor(px/TS), ty=Math.floor(py/TS);
    if(map[ty] && map[ty][tx]===2) return true;
  }
  // trees trunks
  for(const t of trees){
    if(Math.abs((nx+player.w/2)-t.x)<7 && Math.abs((ny+player.h)-(t.y+8))<5) return true;
  }
  // house body
  if(nx < house.px+house.w*TS && nx+player.w > house.px && ny < house.py+house.h*TS && ny+player.h > house.py) return true;
  return false;
}

/* ---------------- update ---------------- */
let last=0, started=false;
function update(dt){
  let vx=0,vy=0;
  if(keys.up)vy-=1; if(keys.down)vy+=1; if(keys.left)vx-=1; if(keys.right)vx+=1;
  const locked = dlg.open||fishing.active||bookOpen;
  player.moving = (vx||vy)&&!locked;
  if(locked){ vx=0; vy=0; player.moving=false; }
  if(vx||vy){
    if(vy<0)player.dir=1; else if(vy>0)player.dir=0;
    if(vx<0)player.dir=3; else if(vx>0)player.dir=2;
    const len=Math.hypot(vx,vy)||1; vx/=len; vy/=len;
    const sp=player.speed*dt;
    let nx=player.x+vx*sp;
    if(!blocked(nx,player.y)) player.x=nx;
    let ny=player.y+vy*sp;
    if(!blocked(player.x,ny)) player.y=ny;
  }
  if(player.moving){ player.animT+=dt*8; player.frame=Math.floor(player.animT)%4; }
  else { player.frame=0; player.animT=0; }

  // camera (float — a rolagem fina é feita arredondando só no nível de pixel de tela)
  cam.x = player.x+player.w/2 - VW/2;
  cam.y = player.y+player.h/2 - VH/2;
  cam.x = Math.max(0, Math.min(WORLD_W-VW, cam.x));
  cam.y = Math.max(0, Math.min(WORLD_H-VH, cam.y));

  // pet segue o jogador com uma folga
  { const tx=player.x, ty=player.y+4, dx=tx-pet.x, dy=ty-pet.y, d=Math.hypot(dx,dy);
    if(d>16){ const sp=Math.min(d-14, player.speed*1.25*dt); pet.x+=dx/d*sp; pet.y+=dy/d*sp;
      pet.moving=true; if(Math.abs(dx)>=Math.abs(dy)) pet.dir = dx<0?3:2; }
    else pet.moving=false;
    if(pet.moving){ pet.animT+=dt*9; pet.frame=Math.floor(pet.animT)%2; } else pet.frame=0; }

  // typewriter
  if(dlg.open && dlg.shown<dlg.full.length){
    dlg.shown += dt*46;
    document.getElementById('dlgBody').textContent = dlg.full.slice(0,Math.floor(dlg.shown));
  }

  // farm growth + toast timer
  for(const f of farm){ if(f.stage>=0 && f.stage<3) f.stage=Math.min(3, Math.floor((tclock-f.plantedAt)/GROW)); }
  if(toast.t>0) toast.t-=dt;

  // fishing
  if(fishing.active){
    if(fishing.phase==='aim'){
      fishing.pos += fishing.dir*fishing.speed*dt;
      if(fishing.pos>1){ fishing.pos=1; fishing.dir=-1; }
      if(fishing.pos<0){ fishing.pos=0; fishing.dir=1; }
    } else if(fishing.phase==='result'){
      fishing.resultT-=dt; if(fishing.resultT<=0) endFishing();
    }
  }

  // hint
  const hintEl=document.getElementById('hint');
  const near=nearStation();
  const nf=near?null:nearFarm();
  if(dlg.open||fishing.active||bookOpen){ hintEl.classList.add('hidden'); }
  else if(nearHouse()){ hintEl.textContent=T().bookHint; hintEl.classList.remove('hidden'); }
  else if(near){ hintEl.textContent=T().hintSign(stTitle(near)); hintEl.classList.remove('hidden'); }
  else if(nf){
    const msg = nf.stage<0 ? T().hintPlantar : nf.stage>=3 ? T().hintColher : T().hintCrescendo;
    hintEl.textContent=msg; hintEl.classList.remove('hidden'); }
  else if(nearWater()){ hintEl.textContent=T().hintPescar; hintEl.classList.remove('hidden'); }
  else { hintEl.classList.add('hidden'); }
}

/* ---------------- render ---------------- */
let tclock=0;
function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle="#20301c"; ctx.fillRect(0,0,cv.width,cv.height);
  // world transform
  ctx.setTransform(SCALE,0,0,SCALE, Math.round(OFX-cam.x*SCALE), Math.round(OFY-cam.y*SCALE));

  // tiles — culling pela área REALMENTE visível na tela (inclui a moldura/letterbox),
  // senão as colunas somem na borda ao andar de lado ("carrega coluna por coluna")
  const vL=cam.x-OFX/SCALE, vT=cam.y-OFY/SCALE, vR=cam.x+(cv.width-OFX)/SCALE, vB=cam.y+(cv.height-OFY)/SCALE;
  const x0=Math.max(0,Math.floor(vL/TS)-1), x1=Math.min(MAP_W,Math.ceil(vR/TS)+1);
  const y0=Math.max(0,Math.floor(vT/TS)-1), y1=Math.min(MAP_H,Math.ceil(vB/TS)+1);
  for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){ drawTile(x,y,map[y][x]); }

  // farm plants
  for(const f of farm) drawFarmPlant(f);
  { const lx=Math.round(7.5*TS), ly=14*TS-4; ctx.font="6px 'Courier New',monospace"; ctx.textAlign="center";
    const t=T().horta, w=ctx.measureText(t).width+6;
    ctx.fillStyle="rgba(0,0,0,.5)"; ctx.fillRect(Math.round(lx-w/2),ly-8,w,8);
    ctx.fillStyle="#cdeb9a"; ctx.fillText(t,lx,ly-2); ctx.textAlign="left"; }
  { const lx=28*TS, ly=14*TS-4; ctx.font="6px 'Courier New',monospace"; ctx.textAlign="center";
    const t=T().lago, w=ctx.measureText(t).width+6;
    ctx.fillStyle="rgba(0,0,0,.5)"; ctx.fillRect(Math.round(lx-w/2),ly-8,w,8);
    ctx.fillStyle="#bfe4ff"; ctx.fillText(t,lx,ly-2); ctx.textAlign="left"; }
  { const lx=house.px+house.w*TS/2, ly=house.py-2; ctx.font="6px 'Courier New',monospace"; ctx.textAlign="center";
    const t=T().houseLabel, w=ctx.measureText(t).width+6;
    ctx.fillStyle="rgba(0,0,0,.5)"; ctx.fillRect(Math.round(lx-w/2),ly-8,w,8);
    ctx.fillStyle="#ffd9a8"; ctx.fillText(t,lx,ly-2); ctx.textAlign="left"; }

  // stations
  for(const s of stations) drawSign(s);

  // depth-sorted: trees & player by baseline y
  const ents=[];
  for(const t of trees) ents.push({y:t.y+8, kind:'tree', o:t});
  ents.push({y:house.py+house.h*TS, kind:'house'});
  ents.push({y:pet.y+9, kind:'pet'});
  ents.push({y:player.y+player.h, kind:'player'});
  ents.sort((a,b)=>a.y-b.y);
  for(const e of ents){
    if(e.kind==='tree') drawTree(e.o);
    else if(e.kind==='house') drawHouse();
    else if(e.kind==='pet') drawPet(ctx, pet.x, pet.y, pet.dir===3, pet.frame);
    else drawChar(ctx, player.x-3, player.y-16, player.dir, player.frame, P(), 1);
  }

  if(toast.t>0) drawToast();

  // UI overlay pinned to viewport (virtual coords)
  ctx.setTransform(SCALE,0,0,SCALE, OFX, OFY);
  if(fishing.active) drawFishing();
}

function drawTile(x,y,t){
  const px=x*TS, py=y*TS;
  let base = "#69a746";                                       // grass (uniform → rolagem lisa)
  if(t===1){ base = "#c19a5e"; }                              // path
  else if(t===2){ base = "#3f8fd0"; }                         // water
  else if(t===3){ base = "#69a746"; }                         // flowerbed grass under
  else if(t===5){ base = ((x+y)&1)? "#7a5230":"#6e4a2a"; }    // tilled soil
  ctx.fillStyle=base; ctx.fillRect(px,py,TS,TS);
  if(t===5){ ctx.fillStyle="rgba(0,0,0,.18)"; ctx.fillRect(px,py+4,TS,1); ctx.fillRect(px,py+11,TS,1);
    ctx.fillStyle="rgba(255,255,255,.05)"; ctx.fillRect(px,py+5,TS,1); ctx.fillRect(px,py+12,TS,1); }
  // grass texture — posições por hash do tile (sem grid marchando ao rolar)
  if(t===0||t===3){
    const s=((x*73856093)^(y*19349663))>>>0;
    ctx.fillStyle="rgba(35,80,28,.28)";
    ctx.fillRect(px+((s>>2)%13), py+2+((s>>6)%11), 1, 2);
    ctx.fillStyle="rgba(255,255,255,.05)";
    ctx.fillRect(px+((s>>9)%14), py+((s>>4)%14), 1, 1);
    ctx.fillStyle="rgba(0,0,0,.05)";
    ctx.fillRect(px+((s>>12)%14), py+((s>>16)%14), 1, 1);
  }
  if(t===1){ ctx.fillStyle="rgba(0,0,0,.06)"; ctx.fillRect(px+2,py+2,1,1); ctx.fillRect(px+9,py+11,1,1); }
  if(t===2){ // water shimmer
    const s=Math.sin((tclock*2)+(x*0.7)+(y*0.9));
    ctx.fillStyle="rgba(255,255,255,"+(0.10+0.06*Math.max(0,s))+")";
    ctx.fillRect(px+2,py+6,6,1);
  }
  if(t===3){ // flowers
    const cols=["#ff6f91","#ffd166","#fff","#c084fc"];
    const c=cols[(x*3+y)%cols.length];
    ctx.fillStyle=c; ctx.fillRect(px+5,py+5,2,2); ctx.fillRect(px+10,py+9,2,2);
    ctx.fillStyle="#e8b"; ctx.fillRect(px+6,py+6,0.5,0.5);
  }
}

function drawTree(t){
  const x=t.x, y=t.y;
  ctx.fillStyle="rgba(0,0,0,.18)"; ctx.beginPath(); ctx.ellipse(x,y+11,7,2.5,0,0,7); ctx.fill();
  ctx.fillStyle="#6b4a2b"; ctx.fillRect(x-2,y+2,4,10);            // trunk
  const sway=Math.sin(tclock*1.4 + x)*1.2;
  ctx.fillStyle="#2f7d34";                                       // canopy
  ctx.beginPath(); ctx.arc(x+sway,y-6,9,0,7); ctx.fill();
  ctx.fillStyle="#3c9a41";
  ctx.beginPath(); ctx.arc(x-4+sway,y-2,6,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(x+5+sway,y-2,6,0,7); ctx.fill();
  ctx.fillStyle="rgba(255,255,255,.10)";
  ctx.beginPath(); ctx.arc(x-2+sway,y-9,3,0,7); ctx.fill();
}

function drawHouse(){
  const x=house.px, y=house.py, W=house.w*TS, H=house.h*TS;
  ctx.fillStyle="rgba(0,0,0,.18)"; ctx.beginPath(); ctx.ellipse(x+W/2,y+H-1,W/2-3,4,0,0,7); ctx.fill();
  ctx.fillStyle="#e2caa0"; ctx.fillRect(x+5,y+17,W-10,H-17);
  ctx.fillStyle="#cdb078"; ctx.fillRect(x+5,y+17,W-10,2);
  ctx.fillStyle="rgba(0,0,0,.06)"; ctx.fillRect(x+5,y+H-3,W-10,3);
  ctx.fillStyle="#b5482f";
  ctx.beginPath(); ctx.moveTo(x+1,y+19); ctx.lineTo(x+W/2,y+2); ctx.lineTo(x+W-1,y+19); ctx.closePath(); ctx.fill();
  ctx.fillStyle="#9c3c26"; ctx.fillRect(x+1,y+18,W-2,2);
  ctx.fillStyle="rgba(255,255,255,.10)"; ctx.beginPath(); ctx.moveTo(x+W/2,y+5); ctx.lineTo(x+W/2-6,y+16); ctx.lineTo(x+W/2,y+16); ctx.closePath(); ctx.fill();
  ctx.fillStyle="#7a4a1e"; ctx.fillRect(x+W/2-6,y+H-16,12,16);
  ctx.fillStyle="#5e3a17"; ctx.fillRect(x+W/2-6,y+H-16,12,2);
  ctx.fillStyle="#e0b84c"; ctx.fillRect(x+W/2+2,y+H-8,1,2);
  ctx.fillStyle="#8fd0ee"; ctx.fillRect(x+9,y+23,8,8);
  ctx.fillStyle="#fff"; ctx.fillRect(x+9,y+23,8,1);
  ctx.fillStyle="rgba(0,0,0,.35)"; ctx.fillRect(x+12,y+23,1,8); ctx.fillRect(x+9,y+27,8,1);
}

function drawPet(g, ox, oy, flip, frame){
  g.fillStyle="rgba(0,0,0,.18)"; g.fillRect(Math.round(ox+2),Math.round(oy+8),9,1);
  if(flip){ g.save(); g.translate(Math.round(ox+13),0); g.scale(-1,1); ox=0; }
  const R=(x,y,w,h,c)=>{ g.fillStyle=c; g.fillRect(Math.round(ox+x),Math.round(oy+y),w,h); };
  const fur="#e0883c", furD="#b96e28", belly="#f6d9ab", eye="#22303a", nose="#8a3b2a";
  R(0,1,1,1,furD); R(0,2,1,3,fur);
  R(1,4,2,3,furD);
  R(2,4,7,3,fur); R(3,6,5,1,belly);
  const a=frame?1:0, b=frame?0:1;
  R(2,7,1,2-a,fur); R(4,7+a,1,2-a,fur); R(7,7,1,2-b,fur); R(9,7+b,1,2-b,fur);
  R(8,2,4,4,fur);
  R(8,1,1,1,fur); R(11,1,1,1,fur);
  R(10,3,1,1,eye); R(12,4,1,1,nose); R(11,5,1,1,belly);
  if(flip) g.restore();
}

function drawFarmPlant(f){
  if(f.stage<0) return;
  const px=f.tx*TS, py=f.ty*TS, cx=px+8;
  if(f.stage===0){ ctx.fillStyle="#4a3418"; ctx.fillRect(px+6,py+9,4,3);
    ctx.fillStyle="#6fae3a"; ctx.fillRect(px+7,py+8,2,1); return; }
  const sway=Math.sin(tclock*2+px)*0.7;
  if(f.stage===1){ ctx.fillStyle="#5aa832"; ctx.fillRect(cx-1,py+8,2,5);
    ctx.fillStyle="#6fc23f"; ctx.fillRect(cx-3,py+9,2,1); ctx.fillRect(cx+1,py+8,2,1); return; }
  if(f.stage===2){ ctx.fillStyle="#3f7d2a"; ctx.fillRect(cx-1,py+6,2,7);
    ctx.fillStyle="#5aa832"; ctx.fillRect(cx-4,py+7,3,2); ctx.fillRect(cx+1,py+6,3,2);
    ctx.fillStyle="#6fc23f"; ctx.fillRect(cx-3,py+4,2,2); ctx.fillRect(cx+1,py+3,2,2); return; }
  const col=FLOWERS[(f.tx*3+f.ty)%FLOWERS.length];
  ctx.fillStyle="#3f7d2a"; ctx.fillRect(cx-1,py+7,2,7);
  ctx.fillStyle="#5aa832"; ctx.fillRect(cx-4,py+8,3,2); ctx.fillRect(cx+1,py+7,3,2);
  ctx.fillStyle=col; ctx.fillRect(Math.round(cx-2+sway),py+2,5,4); ctx.fillRect(Math.round(cx-3+sway),py+3,7,2);
  ctx.fillStyle="#ffe08a"; ctx.fillRect(Math.round(cx+sway),py+3,1,2);
  const a=0.35+0.4*Math.sin(tclock*4+px);
  ctx.fillStyle="rgba(255,255,180,"+a+")"; ctx.fillRect(px+2,py+1,1,1); ctx.fillRect(px+13,py+3,1,1);
}

function drawToast(){
  const tx=player.x+player.w/2, ty=player.y-16;
  ctx.globalAlpha=Math.min(1, toast.t/0.5);
  ctx.font="6px 'Courier New',monospace"; ctx.textAlign="center";
  const w=ctx.measureText(toast.text).width+8;
  const rx=Math.round(tx-w/2), ry=Math.round(ty-8);
  ctx.fillStyle="rgba(20,12,4,.82)"; ctx.fillRect(rx,ry,w,10);
  ctx.fillStyle="#fff4d6"; ctx.fillText(toast.text, Math.round(tx), ry+7);
  ctx.textAlign="left"; ctx.globalAlpha=1;
}

function drawSign(s){
  const x=s.x, y=s.y;
  // glow if not visited
  if(!s.visited){
    const a=0.25+0.15*Math.sin(tclock*3);
    ctx.fillStyle="rgba(255,235,120,"+a+")";
    ctx.beginPath(); ctx.arc(x+8,y+6,11,0,7); ctx.fill();
  }
  ctx.fillStyle="rgba(0,0,0,.18)"; ctx.beginPath(); ctx.ellipse(x+8,y+15,7,2,0,0,7); ctx.fill();
  ctx.fillStyle="#6b4a2b"; ctx.fillRect(x+7,y+8,2,7);           // post
  ctx.fillStyle=shade(s.color,-20); ctx.fillRect(x+1,y-1,14,10);// board back
  ctx.fillStyle=s.color; ctx.fillRect(x+2,y,12,8);              // board
  ctx.fillStyle="rgba(255,255,255,.85)";
  // small "book/pin" mark
  ctx.fillRect(x+4,y+2,6,1); ctx.fillRect(x+4,y+4,6,1); ctx.fillRect(x+4,y+6,4,1);
  // floating label
  const label=stTitle(s).toUpperCase();
  ctx.font="6px 'Courier New',monospace"; ctx.textAlign="center";
  const w=ctx.measureText(label).width+6;
  ctx.fillStyle="rgba(0,0,0,.55)"; ctx.fillRect(x+8-w/2, y-11, w, 8);
  ctx.fillStyle="#fff"; ctx.fillText(label, x+8, y-5);
  ctx.textAlign="left";
}

function drawFishing(){
  const W=224, H=60, x=Math.round((VW-W)/2), y=VH-74;
  ctx.fillStyle="#101826"; ctx.fillRect(x,y,W,H);
  ctx.fillStyle="#1d6fe0"; ctx.fillRect(x,y,W,3);
  ctx.strokeStyle="rgba(255,255,255,.18)"; ctx.lineWidth=1; ctx.strokeRect(x+0.5,y+0.5,W-1,H-1);
  ctx.font="9px 'Courier New',monospace"; ctx.textAlign="center";
  ctx.fillStyle=fishing.rare?"#ffd166":"#bfe0ff";
  ctx.fillText(fishing.rare?T().fishTitleRare:T().fishTitle, x+W/2, y+14);
  const bx=x+18, bw=W-36, by=y+24, bh=12;
  ctx.fillStyle="#0e2033"; ctx.fillRect(bx,by,bw,bh);
  ctx.fillStyle=fishing.rare?"#ffcf4d":"#7bd66a"; ctx.fillRect(Math.round(bx+fishing.zoneStart*bw), by, Math.round(fishing.zoneW*bw), bh);
  ctx.fillStyle="rgba(255,255,255,.25)"; ctx.fillRect(bx,by,bw,1);
  const cxp=Math.round(bx+fishing.pos*bw);
  ctx.fillStyle="#ffd166"; ctx.fillRect(cxp-1, by-3, 3, bh+6);
  ctx.font="7px 'Courier New',monospace";
  let msg,col;
  if(fishing.phase==='aim'){ msg=T().fishAim(fishing.rare); col="#ffe9b0"; }
  else if(fishing.result==='catch'){ msg=T().fishCatch(fishing.caught); col="#8ff0a0"; }
  else { msg=T().fishMiss; col="#ff9b9b"; }
  ctx.fillStyle=col; ctx.fillText(msg, x+W/2, y+H-7);
  ctx.textAlign="left";
}

/* ---------------- HUD ---------------- */
function updateProgress(){
  const done=stations.filter(s=>s.visited).length;
  document.getElementById('progress').innerHTML=T().prog(done, stations.length, harvestCount, fishCount, rareCount);
  if(done===stations.length && !finishShown){
    finishShown=true;
    setTimeout(()=>{ if(!dlg.open){
      openDialogue({icon:"🌟",title:T().finishTitle,color:"#f1c40f",lines:T().finishLines});
    }}, 400);
  }
}

/* ---------------- loop ---------------- */
function frame(ts){
  if(!last)last=ts; let dt=(ts-last)/1000; last=ts; if(dt>0.05)dt=0.05;
  tclock+=dt;
  if(started){ update(dt); draw(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------------- creator UI ---------------- */
const pv=document.getElementById('preview'), pctx=pv.getContext('2d');
pctx.imageSmoothingEnabled=false;
let pvFrame=0, pvT=0, pvLast=0;
function previewLoop(ts){
  if(!pvLast)pvLast=ts; const dt=(ts-pvLast)/1000; pvLast=ts;
  pvT+=dt*6; pvFrame=Math.floor(pvT)%4;
  pctx.clearRect(0,0,pv.width,pv.height);
  pctx.setTransform(1,0,0,1,0,0);
  // ground strip
  pctx.fillStyle="rgba(0,0,0,.08)"; pctx.fillRect(0,pv.height-20,pv.width,20);
  const s=6;
  drawChar(pctx, Math.round(pv.width/2-8*s), pv.height-32*s-10, 0, pvFrame, P(), s);
  if(document.getElementById('creator').classList.contains('hidden')) return;
  requestAnimationFrame(previewLoop);
}
requestAnimationFrame(previewLoop);

function buildSwatches(id, arr, key){
  const box=document.getElementById(id); box.innerHTML="";
  arr.forEach((c,i)=>{
    const d=document.createElement('div'); d.className="sw"+(pal[key]===i?" sel":"");
    d.style.background=c; d.title=c;
    d.onclick=()=>{ pal[key]=i; [...box.children].forEach(ch=>ch.classList.remove('sel')); d.classList.add('sel'); };
    box.appendChild(d);
  });
}
buildSwatches('swSkin',SKINS,'skin');
buildSwatches('swHair',HAIRS,'hair');
buildSwatches('swShirt',SHIRTS,'shirt');
buildSwatches('swPants',PANTS,'pants');

function setStyleLabel(){ document.getElementById('styleVal').textContent=T().styles[pal.style]; }
setStyleLabel();
document.querySelectorAll('[data-cyc]').forEach(b=>{
  b.onclick=()=>{ const d=parseInt(b.dataset.d,10);
    pal.style=(pal.style + d + T().styles.length)%T().styles.length; setStyleLabel(); };
});

function applyLang(){
  const d=T();
  document.getElementById('crTitle').textContent=d.creatorTitle;
  document.getElementById('crSub').textContent=d.creatorSub;
  document.getElementById('lblNome').textContent=d.lblNome;
  document.getElementById('lblCabelo').textContent=d.lblCabelo;
  document.getElementById('lblPele').textContent=d.lblPele;
  document.getElementById('lblCorCabelo').textContent=d.lblCorCabelo;
  document.getElementById('lblCamisa').textContent=d.lblCamisa;
  document.getElementById('lblCalca').textContent=d.lblCalca;
  document.getElementById('start').textContent=d.start;
  document.getElementById('dlgNext').textContent=d.dlgNext;
  document.getElementById('nameIn').placeholder=d.namePh;
  setStyleLabel();
}
document.getElementById('bookClose').onclick=closeBook;
document.getElementById('book').addEventListener('click',e=>{ if(e.target.id==='book') closeBook(); });
document.querySelectorAll('.langbtn').forEach(b=>{
  b.onclick=()=>{ L=b.dataset.lang;
    document.querySelectorAll('.langbtn').forEach(x=>x.classList.toggle('sel', x===b));
    applyLang(); };
});
applyLang();

document.getElementById('start').onclick=()=>{
  const nm=document.getElementById('nameIn').value.trim();
  playerName = nm || T().visitor;
  if(nm) pushVisitor(nm);
  document.getElementById('creator').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  document.getElementById('progress').classList.remove('hidden');
  document.getElementById('hud').innerHTML=T().hud(playerName);
  updateProgress();
  started=true; last=0;
};
})();
</script>
